name: Render architecture diagram

on:
  push:
    paths:
      - 'images/architecture.mmd'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render SVG from Mermaid source
        run: npx -p @mermaid-js/mermaid-cli mmdc -i images/architecture.mmd -o images/image_light.svg -b transparent

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.svg
          git diff --staged --quiet || git commit -m "Auto-render architecture diagram"
          git push
